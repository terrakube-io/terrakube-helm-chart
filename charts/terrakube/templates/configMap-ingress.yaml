{{- if or (eq .Values.ingress.api.ingressClassName "nginx") (and (include "terrakube.singleDomain" .) (eq (toString .Values.ingress.singleDomain.ingressClassName) "nginx")) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  labels:
    {{- include "terrakube.labels" . | nindent 4 }}
data:
  custom-headers.conf: |
    Authorization: $http_authorization
{{ end }}