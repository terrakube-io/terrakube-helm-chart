{{- if .Values.executor.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrakube-executor
  labels:
    {{- include "terrakube.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.executor.replicaCount }}
  revisionHistoryLimit: {{ .Values.executor.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "terrakube-executor.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terrakube-executor.labels" . | nindent 8 }}
        {{- with .Values.executor.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secrets-executor.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configMap-executor.yaml") . | sha256sum }}
{{- if .Values.executor.otel.enabled }}
        checksum/otel-config: {{ include (print $.Template.BasePath "/otel-executor.yaml") . | sha256sum }}
{{- end }}
        {{- with .Values.executor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.executor.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.executor.emptyDirSecret .Values.executor.initContainers }}
      initContainers:
      {{- if .Values.executor.emptyDirSecret }}
      - name: copy-executor-secrets
        {{- if .Values.executor.initRestartPolicy }}
        restartPolicy: {{ .Values.executor.initRestartPolicy | quote }}
        {{- end }}
        image: {{ .Values.executor.initSecretImage | default "busybox:1.37.0" | quote }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            trap 'exit 0' TERM INT

            copy_secrets() {
              echo "Executor is dead/initializing. Copying secrets to /config-rw..."
              chmod 2770 /config-rw
              for f in /config-ro/*; do
                if [ -f "$f" ]; then
                  target="/config-rw/$(basename "$f")"
                  cp -L "$f" "$target"
                  chmod 0660 "$target"
                fi
              done
            }

            clean_secrets() {
              rm -f /config-rw/* 2>/dev/null || true
            }

            is_executor_alive() {
              http_proxy="" no_proxy=127.0.0.1,localhost wget -q -O /dev/null -T 2 http://127.0.0.1:8090/actuator/health/liveness 2>/dev/null
            }

            # 1. Initial copy: executor is not running yet
            copy_secrets
            touch /tmp/synced

            {{- if eq .Values.executor.initRestartPolicy "Always" }}
            executor_alive=0
            boot_timer=0
            fail_count=0

            # 2. Continuous lifecycle monitor
            while true; do
              sleep 3 &
              wait $! 2>/dev/null || true

              if is_executor_alive; then
                fail_count=0
                if [ "$executor_alive" -eq 0 ]; then
                  echo "Executor is alive and healthy. Ensuring secrets directory is clean."
                  clean_secrets
                  executor_alive=1
                  boot_timer=0
                fi
              else
                fail_count=$((fail_count + 1))
                if [ "$executor_alive" -eq 1 ]; then
                  # Require 3 consecutive failed health checks (~9s) before declaring the executor dead,
                  # avoiding spurious re-copies during transient GC pauses or heavy CPU load.
                  if [ "$fail_count" -ge 3 ]; then
                    echo "Executor died (failed 3 consecutive health checks)! Re-copying secrets for container restart."
                    copy_secrets
                    executor_alive=0
                    fail_count=0
                    boot_timer=0
                  fi
                else
                  # If the executor crashed during boot before port 8090 opened and /config-rw is empty,
                  # re-copy after startup timeout (90s) so next restart succeeds
                  boot_timer=$((boot_timer + 3))
                  if [ "$boot_timer" -ge 90 ] && [ -z "$(ls -A /config-rw 2>/dev/null)" ]; then
                    echo "Executor did not start within timeout and secrets are missing. Re-copying secrets."
                    copy_secrets
                    boot_timer=0
                    fail_count=0
                  fi
                fi
              fi
            done
            {{- end }}
        {{- if eq .Values.executor.initRestartPolicy "Always" }}
        startupProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/synced
          initialDelaySeconds: 1
          periodSeconds: 1
          failureThreshold: 30
        {{- end }}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: raw-secret
          mountPath: /config-ro
          readOnly: true
        - name: writable-executor-secrets
          mountPath: /config-rw
      {{- end }}
      {{- with .Values.executor.initContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      - name: terrakube-executor
        image: {{ .Values.executor.image }}:{{ default .Chart.AppVersion .Values.executor.version }}
        {{- if .Values.executor.resources }}
        resources: {{- toYaml .Values.executor.resources | nindent 12 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8090
        {{- if and .Values.executor.otel.enabled .Values.executor.otel.metrics }}
        - name: metrics
          containerPort: {{ .Values.executor.otel.metrics.port | default "9464" }}
        {{- end }}
        env:
        {{- if .Values.executor.emptyDirSecret }}
        - name: ExecutorSecretsDirectory
          value: "/etc/terrakube/secrets"
        {{- end }}
        {{- if .Values.security.caCerts }}
        - name: SERVICE_BINDING_ROOT
          value: /mnt/platform/bindings
        {{- end }}
        {{- with .Values.executor.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.executor.emptyDirSecret }}
        - name: writable-executor-secrets
          mountPath: /etc/terrakube/secrets
        {{- end }}
        {{- if .Values.security.caCerts }}
        - name: ca-certs
          mountPath: /mnt/platform/bindings/ca-certificates
          readOnly: true
        {{- end }}
        {{- with .Values.executor.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        envFrom:
        {{- range .Values.executor.configMaps }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- if .Values.executor.otel.enabled}}
        - configMapRef:
            name: "terrakube-executor-otel-config"
        {{- end }}
        {{- if not .Values.executor.emptyDirSecret }}
        {{- range .Values.executor.secrets }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          failureThreshold: {{ .Values.executor.startupProbe.failureThreshold }}
          periodSeconds: {{ .Values.executor.startupProbe.periodSeconds }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          periodSeconds: {{ .Values.executor.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          periodSeconds: {{ .Values.executor.readinessProbe.periodSeconds }}
          failureThreshold: {{ .Values.executor.readinessProbe.failureThreshold | default 1 }}
        {{- with .Values.executor.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.executor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.executor.emptyDirSecret }}
      - name: raw-secret
        projected:
          sources:
          {{- range (.Values.executor.secrets | default (list "terrakube-executor-secrets")) }}
          - secret:
              name: {{ . | quote }}
          {{- end }}
      - name: writable-executor-secrets
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      {{- end }}
      {{- if .Values.security.caCerts }}
      - name: ca-certs
        secret:
          secretName: terrakube-ca-secrets
      {{- end }}
      {{- with .Values.executor.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.executor.serviceAccountName }}
      serviceAccountName: {{ quote . }}
      {{- end }}
      {{- with .Values.executor.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}
