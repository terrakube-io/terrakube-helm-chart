{{- if .Values.executor.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrakube-executor
  labels:
    {{- include "terrakube.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.executor.replicaCount }}
  revisionHistoryLimit: {{ .Values.executor.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "terrakube-executor.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terrakube-executor.labels" . | nindent 8 }}
        {{- with .Values.executor.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secrets-executor.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configMap-executor.yaml") . | sha256sum }}
{{- if .Values.executor.otel.enabled }}
        checksum/otel-config: {{ include (print $.Template.BasePath "/otel-executor.yaml") . | sha256sum }}
{{- end }}
        {{- with .Values.executor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.executor.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (.Values.executor.cache).enabled .Values.executor.initContainers }}
      initContainers:
      {{- if (.Values.executor.cache).enabled }}
      {{- $cachePath := .Values.executor.cache.path | default "/home/cnb/.terraform.d" | trimSuffix "/" }}
      # Terraform/OpenTofu refuse a TF_PLUGIN_CACHE_DIR that does not exist and a fresh volume is
      # empty, so create the cache sub-directories (as the executor's own user) before the executor starts.
      - name: init-terraform-cache
        image: {{ .Values.executor.image }}:{{ default .Chart.AppVersion .Values.executor.version }}
        command: ["sh", "-c", {{ printf "mkdir -p %s/plugin-cache %s/data" $cachePath $cachePath | quote }}]
        volumeMounts:
        - name: terraform-cache
          mountPath: {{ $cachePath | quote }}
        {{- with .Values.executor.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.executor.initContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      - name: terrakube-executor
        image: {{ .Values.executor.image }}:{{ default .Chart.AppVersion .Values.executor.version }}
        {{- if .Values.executor.resources }}
        resources: {{- toYaml .Values.executor.resources | nindent 12 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8090
        {{- if and .Values.executor.otel.enabled .Values.executor.otel.metrics }}
        - name: metrics
          containerPort: {{ .Values.executor.otel.metrics.port | default "9464" }}
        {{- end }}
        env:
        {{- if .Values.security.caCerts }}
        - name: SERVICE_BINDING_ROOT
          value: /mnt/platform/bindings
        {{- end }}
        {{- if (.Values.executor.cache).enabled }}
        {{- $cachePath := .Values.executor.cache.path | default "/home/cnb/.terraform.d" | trimSuffix "/" }}
        {{- if .Values.executor.cache.providers }}
        - name: TF_PLUGIN_CACHE_DIR
          value: {{ printf "%s/plugin-cache" $cachePath | quote }}
        {{- if .Values.executor.cache.ignoreLockFile }}
        - name: TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE
          value: "1"
        {{- end }}
        {{- end }}
        {{- if .Values.executor.cache.modules }}
        - name: TerraformDataDirCacheRoot
          value: {{ printf "%s/data" $cachePath | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.executor.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.security.caCerts }}
        - name: ca-certs
          mountPath: /mnt/platform/bindings/ca-certificates
          readOnly: true
        {{- end }}
        {{- if (.Values.executor.cache).enabled }}
        - name: terraform-cache
          mountPath: {{ .Values.executor.cache.path | default "/home/cnb/.terraform.d" | trimSuffix "/" | quote }}
        {{- end }}
        {{- with .Values.executor.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        envFrom:
        {{- range .Values.executor.configMaps }}
        - configMapRef:
            name: {{ . | quote }}
        {{- end }}
        {{- if .Values.executor.otel.enabled}}
        - configMapRef:
            name: "terrakube-executor-otel-config"
        {{- end }}
        {{- range .Values.executor.secrets }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          failureThreshold: {{ .Values.executor.startupProbe.failureThreshold }}
          periodSeconds: {{ .Values.executor.startupProbe.periodSeconds }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          periodSeconds: {{ .Values.executor.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          periodSeconds: {{ .Values.executor.readinessProbe.periodSeconds }}
          failureThreshold: {{ .Values.executor.readinessProbe.failureThreshold | default 1 }}
        {{- with .Values.executor.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.executor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.security.caCerts }}
      - name: ca-certs
        secret:
          secretName: terrakube-ca-secrets
      {{- end }}
      {{- if (.Values.executor.cache).enabled }}
      - name: terraform-cache
        {{- if .Values.executor.cache.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.executor.cache.existingClaim | quote }}
        {{- else }}
        emptyDir:
          {{- with .Values.executor.cache.sizeLimit }}
          sizeLimit: {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.executor.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.executor.serviceAccountName }}
      serviceAccountName: {{ quote . }}
      {{- end }}
      {{- with .Values.executor.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}
