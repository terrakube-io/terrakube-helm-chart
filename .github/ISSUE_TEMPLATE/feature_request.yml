name: Feature request
description: A new chart option, template or integration.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do with the chart today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed values
      description: How the option would look in values.yaml, and what it renders.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Minimum Terrakube version needed, impact on existing installs, alternatives you tried.
