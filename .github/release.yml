# Categories for auto-generated GitHub release notes.
changelog:
  exclude:
    labels:
      - "autorelease: pending"
      - "autorelease: tagged"
      - dependencies
      - github_actions
  categories:
    - title: Breaking changes
      labels: [breaking change]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
