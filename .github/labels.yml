# Synced to the repository by .github/workflows/labels.yml.
- {name: bug, color: "d73a4a", description: "Something is broken"}
- {name: enhancement, color: "a2eeef", description: "New feature or chart option"}
- {name: documentation, color: "0075ca", description: "Improvements or additions to documentation"}
- {name: question, color: "d876e3", description: "Further information is requested"}
- {name: good first issue, color: "7057ff", description: "Well scoped, suitable for a first contribution"}
- {name: help wanted, color: "008672", description: "Extra attention is needed"}
- {name: duplicate, color: "cfd3d7", description: "This issue or pull request already exists"}
- {name: invalid, color: "e4e669", description: "This doesn't seem right"}
- {name: wontfix, color: "ffffff", description: "This will not be worked on"}
- {name: dependencies, color: "0366d6", description: "Pull requests that update a dependency"}
- {name: github_actions, color: "000000", description: "Updates to GitHub Actions workflows"}
- {name: area/chart, color: "1d76db", description: "Chart templates and Chart.yaml"}
- {name: area/values, color: "1d76db", description: "values.yaml and values.schema.json"}
- {name: area/ingress, color: "1d76db", description: "Ingress, Gateway API, GKE and AWS ALB resources"}
- {name: area/api, color: "1d76db", description: "Terrakube API component"}
- {name: area/executor, color: "1d76db", description: "Terrakube executor component"}
- {name: area/registry, color: "1d76db", description: "Terrakube registry component"}
- {name: area/ui, color: "1d76db", description: "Terrakube UI component"}
- {name: area/dependencies, color: "1d76db", description: "Sub-charts: PostgreSQL, MinIO, Valkey, Dex"}
- {name: area/docs, color: "0075ca", description: "README, examples and contributor docs"}
- {name: area/ci, color: "5319e7", description: "Workflows, tooling, dependency updates"}
- {name: breaking change, color: "b60205", description: "Requires users to change their values or upgrade steps"}
- {name: needs triage, color: "fbca04", description: "Not yet reviewed by a maintainer"}
- {name: needs repro, color: "fbca04", description: "Waiting for values and version details"}
- {name: terrakube app, color: "c5def5", description: "Needs a change or fix in Terrakube itself, not the chart"}
- {name: priority/high, color: "d93f0b", description: "Broken install or upgrade, or blocks common use"}
- {name: priority/medium, color: "fbca04", description: "Should be done soon"}
- {name: priority/low, color: "c2e0c6", description: "Nice to have"}
