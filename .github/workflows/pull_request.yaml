name: Release Charts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate package.json against a local schema
        uses: cardinalby/schema-validator-action@2166123eb256fa40baef7e22ab1379708425efc7 # 3.1.1
        with:
          file: charts/terrakube/values.yaml
          schema: charts/terrakube/values.schema.json

      - name: Check the single-domain route table copy
        run: |
          url=https://raw.githubusercontent.com/terrakube-io/terrakube/main/docs/single-domain/route-table.yaml
          if curl -fsSL "$url" -o /tmp/route-table.yaml; then
            diff -u /tmp/route-table.yaml charts/terrakube/files/route-table.yaml
          else
            echo "route-table.yaml is not published in terrakube main yet; skipping"
          fi
