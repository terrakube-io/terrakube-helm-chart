# Publishes the chart when a change under charts/ lands on main. The chart version in
# charts/terrakube/Chart.yaml decides the release: versions that already exist are
# skipped. See RELEASING.md.
name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write lets chart-releaser create the GitHub release and update gh-pages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Add repositories
        run: |
          for dir in charts/*/; do
            helm dependency list "$dir" 2> /dev/null | tail -n +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read -r cmd; do $cmd; done
          done

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Package and push charts to OCI registry
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          mkdir -p .oci-release-packages
          namespace="${DOCKERHUB_NAMESPACE,,}"

          if [ -z "$namespace" ]; then
            echo "Docker Hub namespace is required. Set DOCKERHUB_NAMESPACE repo variable."
            exit 1
          fi

          for dir in charts/*/; do
            chart_name="terrakube-helm-chart"
            chart_version="$(helm show chart "$dir" | awk -F': ' '$1 == "version" { print $2; exit }')"
            oci_ref="oci://registry-1.docker.io/${namespace}/${chart_name}"

            if helm show chart "$oci_ref" --version "$chart_version" > /dev/null 2>&1; then
              echo "${chart_name} ${chart_version} already exists in Docker Hub, skipping OCI push."
              continue
            fi

            helm dependency build "$dir"
            package="$(helm package "$dir" --destination .oci-release-packages | awk -F': ' '/Successfully packaged chart and saved it to:/ { print $2 }')"
            helm push "$package" "oci://registry-1.docker.io/${namespace}"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
